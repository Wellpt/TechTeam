name: Validar e publicar site

on:
    pull_request:
      branches:
        - main
    push:
      branches:
        - main
    workflow_dispatch:

permissions:
      contents: read
      pages: write
      id-token: write

jobs: 
  validade:
    name: validar arquivos do site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

      - name: Verificar arquivos essenciais
        run: |
          test -f index.html
          test -f style.css
          test -f identity.css
          test -f carousel.css
          test -f carousel.js

      - name: Verificar sintaxe do JS
        run: node --check carousel.js
  deploy:
    name: Publicar no GitHub Pages
    needs: validade
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url}}

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Separar arquivos do Site
        run: | 
          mkdir public-site
          cp index.html style.css identity.css carousel.css carousel.js public-site/
          cp -r images public-site/

      - name: Preparar arquivos para publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site 

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
          